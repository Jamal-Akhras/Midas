[project]
name = "midas"
version = "0.1.0"
description = "Midas: a personal, fully-audited trading committee bot (decision support, paper-first)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jamal Akhras" }]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.57,<3",
    "pydantic>=2.14.3,<3",
    "pydantic-settings>=2.15.0,<3",
    "httpx>=0.28.1,<1",
    "pyyaml>=6.0.3,<7",
    "alembic>=1.20.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.4,<1",
    "mypy>=2.4.1,<3",
    "types-PyYAML>=6.0.12.20261103,<7",
    "pre-commit>=4.6.2,<5",
]
live = ["yfinance>=1.8.0,<2"]
research = [
    "pandas>=2.3.3,<3",
    "numpy>=2.2.6,<3",
    "yfinance>=1.8.0,<2",
    "lxml>=6.1.3,<7",
]

[project.urls]
Repository = "https://github.com/Jamal-Akhras/Midas"

[project.scripts]
midas = "midas.cli:main"

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["midas*"]

[tool.setuptools.package-data]
midas = ["providers/routing.yaml", "agents/prompts/*.md"]
"midas.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # long lines: the formatter wraps code; strings and comments are reviewed by eye
    "B008",  # function calls in argument defaults (pydantic Field())
    "SIM108", # ternaries are not always clearer
    "B904",  # raise ... from inside except: applied where it adds information
    "SIM105", # try/except/pass reads fine for best-effort side effects
]

[tool.ruff.lint.isort]
known-first-party = ["midas"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ["^scripts/", "^build/"]

[[tool.mypy.overrides]]
# new code is held to the strict profile (mypy --strict, spelled out because
# "strict" itself is not a per-module option)
module = ["midas.research.*", "midas.strategy.*", "midas.notify.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_untyped_decorators = true
# pandas ships no type information, so every frame operation is Any;
# warning on returning it would flag every function in this package
warn_return_any = false
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.coverage.run]
source = ["midas"]
branch = true
omit = ["midas/ui/*"]  # browser console: exercised by hand, not by the suite

[tool.coverage.report]
fail_under = 65
skip_covered = false
show_missing = false
