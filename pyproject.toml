[project]
name = "midas"
version = "0.1.0"
description = "Midas: a personal, fully-audited trading committee bot (decision support, paper-first)"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
live = ["yfinance>=0.2.40"]

[project.scripts]
midas = "midas.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["midas*"]

[tool.setuptools.package-data]
midas = ["providers/routing.yaml", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
