[project]
name = "midas"
version = "0.1.0"
description = "Midas: a personal, fully-audited trading committee bot (decision support, paper-first)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jamal Akhras" }]
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.0,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]
live = ["yfinance>=0.2.40,<2"]

[project.urls]
Repository = "https://github.com/Jamal-Akhras/Midas"

[project.scripts]
midas = "midas.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["midas*"]

[tool.setuptools.package-data]
midas = ["providers/routing.yaml", "agents/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
