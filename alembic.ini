# Alembic CLI configuration. `midas init` runs migrations itself; this file is
# for hand-driven work (alembic revision --autogenerate, alembic history).
# The database URL comes from settings (DATABASE_URL / .env), see
# midas/migrations/env.py.
[alembic]
script_location = midas/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
