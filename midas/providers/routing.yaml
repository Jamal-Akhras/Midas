# Routing table: data, not code. Candidates tried in order; ProviderError
# falls through to the next. Prices are USD per 1M tokens, checked against
# the vendors' price pages on 2026-11-08. A stale price corrupts the
# write-ahead cost log, so update this file when the vendors move.
#
# Deliberate committee design: bull_case and bear_case lead with DIFFERENT
# providers so the two cases come from different models. Their disagreement
# is a feature. A test enforces the lists stay divergent, and the committee
# asserts at run time that the two cases were actually produced by different
# providers (REQUIRE_CASE_PROVIDER_DIVERSITY) - routing fall-through once
# silently put both cases on the same model.
#
# Cheap stages lead with Haiku 5.5: at $0.10/$0.50 it is 10x cheaper than the
# previous Haiku and makes screening, triage and post-mortems nearly free.

models:
  gpt-4o:            { provider: openai,    tier: high,  price_in: 2.50, price_out: 10.00 }
  gpt-4o-mini:       { provider: openai,    tier: cheap, price_in: 0.15, price_out: 0.60 }
  claude-opus-5-5:   { provider: anthropic, tier: high,  price_in: 4.00, price_out: 20.00 }
  claude-sonnet-5-5: { provider: anthropic, tier: high,  price_in: 2.00, price_out: 10.00 }
  claude-haiku-5-5:  { provider: anthropic, tier: cheap, price_in: 0.10, price_out: 0.50 }
  gemini-2.0-flash:  { provider: gemini,    tier: cheap, price_in: 0.10, price_out: 0.40 }
  gemini-2.5-pro:    { provider: gemini,    tier: high,  price_in: 1.25, price_out: 10.00 }

task_types:
  screening:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  triage:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  fundamentals:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  deep_research:
    - claude-sonnet-5-5
    - gpt-4o
    - gemini-2.5-pro
  catalyst:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  bull_case:
    - claude-sonnet-5-5
    - gemini-2.5-pro
    - gpt-4o
  bear_case:
    - gpt-4o
    - gemini-2.5-pro
    - claude-sonnet-5-5
  structuring_assist:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  verdict:
    - claude-opus-5-5
    - gpt-4o
    - gemini-2.5-pro
  reevaluation:
    - claude-sonnet-5-5
    - gpt-4o
    - gemini-2.5-pro
  portfolio_review:
    - claude-sonnet-5-5
    - gpt-4o
    - gemini-2.5-pro
  postmortem:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash
  event_scan:
    - claude-haiku-5-5
    - gpt-4o-mini
    - gemini-2.0-flash

# high-risk tasks may only use high-tier models, regardless of candidate order
risk_rules:
  high_requires_tier: high
